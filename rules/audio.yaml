# cutcheck rulepack — audio
#
# Thresholds are DATA, not code. Edit them here; the check logic lives in src/rules/checks/<id>.ts.
# Every threshold carries a source, the date it was last verified, and a confidence — because most
# "platform specs" for social video are crowd-measured, not published. Stale measured_on = suspect.
#
# severity: S1 blocks the export (exit 1). S2 is advisory (exit 0). Taste is never S1.
pack: audio
version: 1
rules:
  - id: CB-AUD-001
    name: loudness_integrated_out_of_range
    severity: S1
    applies_to: [reels, shorts]
    requires: [loudness]
    threshold:
      target_lufs: -14
      tolerance_lu: 1
    source:
      citation: >-
        Practical short-form convention: -14 LUFS integrated. No official Instagram/TikTok/YouTube target
        is published; Meta has stated it uses adaptive loudness management (xHE-AAC). Measurement method is
        ITU-R BS.1770 / EBU R128 gated integrated loudness via ffmpeg's ebur128 filter.
      url: https://tech.ebu.ch/publications/r128
      measured_on: 2026-09-09
      confidence: medium
    rationale: >-
      Platforms normalise playback toward roughly -14 LUFS. An export far above it gets turned down
      (and was probably clipped to get there); far below it plays noticeably quieter than the feed around it.
      Either way the viewer notices before the editor does.

  - id: CB-AUD-002
    name: true_peak_over_ceiling
    severity: S1
    applies_to: [reels, shorts]
    requires: [loudness]
    threshold:
      max_true_peak_dbtp: -1.0
    source:
      citation: >-
        EBU R128 sets a Maximum Permitted True Peak Level of -1 dBTP for programme material, measured with
        the true-peak algorithm of ITU-R BS.1770 (minimum 4x oversampling). Unlike the -14 LUFS target in
        CB-AUD-001, this number is published in a standard rather than crowd-measured from screenshots,
        which is why it carries high confidence -- but the standard addresses broadcast, not social
        delivery. Streaming practice often tightens the ceiling to -2 dBTP for extra headroom against
        lossy transcoding; lower max_true_peak_dbtp to adopt that, no code change needed.
      url: https://tech.ebu.ch/publications/r128
      measured_on: 2026-09-15
      confidence: high
    rationale: >-
      True peak is the level of the waveform the stored samples reconstruct into on playback, and it can
      sit above the highest stored sample. An export can therefore contain no clipped sample at all and
      still overshoot the ceiling once a platform re-encodes it to AAC or Opus, where the overshoot becomes
      audible distortion. Playback normalisation does not undo it -- turning a file down afterwards cannot
      remove clipping already baked into the decode -- so this has to be caught before publish, not after.
